# Test profile.
# - Owns deterministic in-memory infrastructure and disables Kafka listener startup by default.
# - Does not depend on developer machine environment variables or .env files.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

jwt:
  secret: test-jwt-secret

app:
  vapid:
    public-key: BCJqbgnMJBUSN4VChYAQ1XmHeCy1-dL8EXhr1urZw5pP-RUnIluVV-q3sbw7yUyAfSt24r9pzFjgpW-bia0b8lA
    private-key: UaO5mP8qEqr3KJsUFGIiwhFV09lpQAKbSDIQJQDKLhM
    subject: mailto:test@test.com
  retention:
    default-days: 90
  kafka:
    retry-backoff-ms: 100
