# Local profile.
# - Owns local infrastructure connections: PostgreSQL and Kafka broker settings.
# - Uses DB_URL, DB_USERNAME, DB_PASSWORD and KAFKA_* environment variables when provided.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:}
      ssl.truststore.location: ${KAFKA_CA_PATH:}
